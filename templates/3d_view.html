<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LuminaLanes — 3D Library Digital Twin</title>
  <meta name="description" content="3D WebGL Library Environment for Li-Fi Optical Beam Simulation, Access Points, Tables, and Intersection Sensors using Three.js.">

  <!-- Modern Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Three.js ES Module Import Map -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>

  <style>
    :root {
      --bg-dark: #070b14;
      --panel-bg: rgba(15, 23, 42, 0.85);
      --panel-border: rgba(59, 130, 246, 0.25);
      --accent-blue: #3b82f6;
      --accent-cyan: #38bdf8;
      --accent-yellow: #facc15;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-dark);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: var(--text-main);
      user-select: none;
    }

    /* WebGL Canvas Viewport Container */
    #canvas-container {
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    /* Floating Cyber HUD Overlay */
    .hud-header {
      position: absolute;
      top: 16px;
      left: 20px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 6px;
      pointer-events: none;
    }

    .brand-pill {
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 10px 16px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5), 0 0 15px rgba(37, 99, 235, 0.15);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-badge {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: linear-gradient(135deg, #2563eb, #38bdf8);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 10px rgba(59, 130, 246, 0.6);
      font-size: 14px;
      font-weight: 900;
    }

    .brand-title {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: -0.01em;
      background: linear-gradient(90deg, #60a5fa, #38bdf8, #93c5fd);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-subtitle {
      font-size: 10px;
      font-family: 'JetBrains Mono', monospace;
      color: var(--text-muted);
      letter-spacing: 0.04em;
    }

    /* Top Right Telemetry Badges */
    .hud-top-right {
      position: absolute;
      top: 16px;
      right: 20px;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 10px;
      pointer-events: none;
    }

    .stat-badge {
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      backdrop-filter: blur(12px);
      padding: 8px 14px;
      border-radius: 10px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
    }

    .pulse-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 8px #10b981;
      animation: pulse 2s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(1.3); }
    }

    /* Bottom Instructions / Legend Overlay */
    .hud-bottom {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      backdrop-filter: blur(14px);
      padding: 10px 22px;
      border-radius: 30px;
      display: flex;
      align-items: center;
      gap: 20px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--text-muted);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.6);
      pointer-events: none;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .legend-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
    }

    .dot-ap { background: #3b82f6; box-shadow: 0 0 8px #3b82f6; }
    .dot-user { background: #38bdf8; box-shadow: 0 0 6px #38bdf8; }
    .dot-camera { background: #facc15; box-shadow: 0 0 6px #facc15; border-radius: 2px; }
    .dot-bookshelf { background: #475569; border: 1px solid #d97706; border-radius: 2px; }

    .separator {
      color: rgba(148, 163, 184, 0.3);
    }
  </style>
</head>
<body>

  <!-- 3D WebGL Canvas Container -->
  <div id="canvas-container"></div>

  <!-- HUD Overlays -->
  <div class="hud-header">
    <div class="brand-pill">
      <div class="brand-badge">3D</div>
      <div>
        <div class="brand-title">LuminaLanes — 3D Library Digital Twin</div>
        <div class="brand-subtitle">THREE.JS OPTICAL SIMULATION ENVIRONMENT</div>
      </div>
    </div>
  </div>

  <div class="hud-top-right">
    <div class="stat-badge">
      <span class="pulse-dot"></span>
      <span style="color: #60a5fa;">ENGINE: THREE.JS WebGL</span>
    </div>
    <div class="stat-badge">
      <span style="color: #94a3b8;">ORBIT: ROTATE [L-DRAG] • PAN [R-DRAG] • ZOOM [SCROLL]</span>
    </div>
  </div>

  <div class="hud-bottom">
    <div class="legend-item">
      <span class="legend-dot dot-ap"></span>
      <span style="color: #93c5fd;">6 APs (Ceiling Nodes)</span>
    </div>
    <span class="separator">|</span>
    <div class="legend-item">
      <span class="legend-dot dot-user"></span>
      <span style="color: #bae6fd;">Users (Study Patrons)</span>
    </div>
    <span class="separator">|</span>
    <div class="legend-item">
      <span class="legend-dot dot-camera"></span>
      <span style="color: #fde047;">Cameras (Junction Sensors)</span>
    </div>
    <span class="separator">|</span>
    <div class="legend-item">
      <span class="legend-dot dot-bookshelf"></span>
      <span style="color: #e2e8f0;">Bookshelves & Tables</span>
    </div>
  </div>

  <!-- 3D Simulation Entry Script -->
  <script type="module" src="{{ url_for('static', filename='3d_main.js') }}"></script>
</body>
</html>
